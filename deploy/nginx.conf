server {
    listen 80;
    server_name 172.16.0.71;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 172.16.0.71;

    # Replace with your cert paths (letsencrypt or self-signed)
    ssl_certificate /etc/letsencrypt/live/yourdomain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain/privkey.pem;

    root /var/www/asistencia/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Serve static frontend and fallback to index.html for SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: increase body size for file uploads
    client_max_body_size 20M;
}
